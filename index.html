<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- 禁止移动端缩放：注意会影响无障碍可访问性（视力障碍用户无法放大） -->
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,viewport-fit=cover"
    />
    <title>I TV</title>

    <!-- PWA: iOS standalone mode + status bar -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Theme Color: 内联脚本在首帧前同步设置，避免状态栏颜色闪烁 -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212" />

    <!-- 防止暗色模式初始闪烁 + 首帧状态栏颜色：在首帧渲染前同步设置 -->
    <script>
      (function () {
        var theme = localStorage.getItem('theme')
        var isDark =
          theme === 'dark' ||
          ((theme === 'system' || !theme) &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (isDark) {
          document.documentElement.classList.add('dark')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', '#121212')
        }
      })()
    </script>

    <!-- 预连接 TMDB CDN 和 API，减少 LCP 图片发现延迟 -->
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://api.themoviedb.org" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* 额外保险（主要针对旧版 iOS Safari 的双指/三指手势） */
      document.addEventListener(
        'gesturestart',
        function (e) {
          e.preventDefault()
        },
        { passive: false },
      )
      /* 预加载上次访问的巨幕图，跳过 React 渲染延迟 */
      try {
        var cached = sessionStorage.getItem('lcp_backdrop')
        if (cached) {
          var link = document.createElement('link')
          link.rel = 'preload'
          link.as = 'image'
          link.fetchPriority = 'high'
          link.href = cached
          document.head.appendChild(link)
        }
      } catch (_) {}
    </script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
